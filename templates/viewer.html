                                var padRot = getRotationAngle(p.rot);
                                var padLen = diameter * 2.0;
                                var padW = diameter;
                                var rCorner = diameter / 2.0;
                                outer = document.createElementNS("http://www.w3.org/2000/svg", "rect");
                                outer.setAttribute("x", p.x - padLen / 2.0);
                                outer.setAttribute("y", -p.y - padW / 2.0);
                                outer.setAttribute("width", padLen);
                                outer.setAttribute("height", padW);
                                outer.setAttribute("rx", rCorner);
                                outer.setAttribute("ry", rCorner);
                                outer.setAttribute("class", "pcb-pad-thru");
                                if (padRot !== 0) {
                                    outer.setAttribute("transform", `rotate(${-padRot}, ${p.x}, ${-p.y})`);
                                }
                            } else {
                                outer = document.createElementNS("http://www.w3.org/2000/svg", "circle");
                                outer.setAttribute("cx", p.x);
                                outer.setAttribute("cy", -p.y);
                                outer.setAttribute("r", diameter / 2);
                                outer.setAttribute("class", "pcb-pad-thru");
                            }
                            gPads.appendChild(outer);
                            USED_LAYERS.add(17);

                            var inner = document.createElementNS("http://www.w3.org/2000/svg", "circle");
                            inner.setAttribute("cx", p.x);
                            inner.setAttribute("cy", -p.y);
                            inner.setAttribute("r", p.drill / 2);
                            inner.setAttribute("class", "pcb-pad-hole");
                            gPads.appendChild(inner);
                        });
                    }

                    // Package Holes (Capa 45)
                    if (pkg.holes && pkg.holes.length > 0) {
                        var gHoles = document.createElementNS("http://www.w3.org/2000/svg", "g");
                        gHoles.setAttribute("transform", transformStr);
                        groupDrills.appendChild(gHoles);

                        pkg.holes.forEach(h => {
                            var holeCircle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
                            holeCircle.setAttribute("cx", h.x);
                            holeCircle.setAttribute("cy", -h.y);
                            holeCircle.setAttribute("r", h.drill / 2);
                            holeCircle.setAttribute("class", "pcb-pad-hole layer-45");
                            gHoles.appendChild(holeCircle);
                            USED_LAYERS.add(45);
                        });
                    }

                    // Serigrafía / Geometría del paquete (Polígonos, Wires, Circles)
                    var hasSilkGeom = (pkg.polygons && pkg.polygons.length > 0) ||
                                      (pkg.wires && pkg.wires.length > 0) ||
                                      (pkg.circles && pkg.circles.length > 0);

                    if (hasSilkGeom) {
                        var gSilk = document.createElementNS("http://www.w3.org/2000/svg", "g");
                        gSilk.setAttribute("class", "interactive-part");
                        gSilk.setAttribute("data-part", elem.name);
                        gSilk.setAttribute("transform", transformStr);
                        groupSilk.appendChild(gSilk);

                        if (pkg.polygons) {
                            pkg.polygons.forEach(poly => {
                                var pLayerNum = poly.layer ? (mirrored ? (poly.layer === 21 ? 22 : (poly.layer === 22 ? 21 : poly.layer)) : poly.layer) : silkLayerNum;
                                var el = createSvgPolygon(poly, `pcb-silk-poly layer-${pLayerNum}`);
                                gSilk.appendChild(el);
                                USED_LAYERS.add(pLayerNum);
                            });
                        }

                        if (pkg.wires) {
                            pkg.wires.forEach(w => {
                                var wLayerNum = w.layer ? (mirrored ? (w.layer === 21 ? 22 : (w.layer === 22 ? 21 : w.layer)) : w.layer) : silkLayerNum;
                                var el = createSvgWire(w, `pcb-silk-wire layer-${wLayerNum}`);
                                gSilk.appendChild(el);
                                USED_LAYERS.add(wLayerNum);
                            });
                        }

                        if (pkg.circles) {
                            pkg.circles.forEach(c => {
                                var cLayerNum = c.layer ? (mirrored ? (c.layer === 21 ? 22 : (c.layer === 22 ? 21 : c.layer)) : c.layer) : silkLayerNum;
                                var circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
                                circle.setAttribute("cx", c.x);
                                circle.setAttribute("cy", -c.y);
                                circle.setAttribute("r", c.radius);
                                circle.setAttribute("class", `pcb-silk-wire layer-${cLayerNum}`);
                                gSilk.appendChild(circle);
                                USED_LAYERS.add(cLayerNum);
                            });
                        }
                    }
                }

                // Textos y Atributos (Smashed vs Default Package Text)
                if (elem.smashed && elem.attributes && elem.attributes.length > 0) {
                    elem.attributes.forEach(attr => {
                        if (!attr.name || attr.display === "off") return;
                        var val = attr.value;
                        if (attr.name === "NAME") val = elem.name;
                        else if (attr.name === "VALUE") val = elem.value;
                        if (!val) return;

                        var attrText = document.createElementNS("http://www.w3.org/2000/svg", "text");
                        attrText.setAttribute("x", attr.x);
                        attrText.setAttribute("y", -attr.y);
                        var aLayerNum = attr.layer || (mirrored ? 26 : 25);
                        attrText.setAttribute("class", `pcb-silk-text layer-${aLayerNum} interactive-part-text`);
                        attrText.setAttribute("data-part", elem.name);
                        USED_LAYERS.add(aLayerNum);

                        var aRot = getRotationAngle(attr.rot);
                        var aMirrored = isMirrored(attr.rot);
                        var tf = "";
                        if (aMirrored) tf += "scale(-1, 1) ";
                        if (aRot !== 0) tf += `rotate(${-aRot}, ${attr.x}, ${-attr.y}) `;
                        if (tf) attrText.setAttribute("transform", tf);

                        if (attr.size) attrText.style.fontSize = `${attr.size}px`;
                        attrText.textContent = val;
                        groupText.appendChild(attrText);
                    });
                } else if (pkg && pkg.texts && pkg.texts.length > 0) {
                    var gText = document.createElementNS("http://www.w3.org/2000/svg", "g");
                    gText.setAttribute("class", "interactive-part-text");
                    gText.setAttribute("data-part", elem.name);
                    gText.setAttribute("transform", transformStr);
                    groupText.appendChild(gText);

                    var hasExplicitName = false;
                    pkg.texts.forEach(t => {
                        var pText = document.createElementNS("http://www.w3.org/2000/svg", "text");
                        pText.setAttribute("x", t.x);
                        pText.setAttribute("y", -t.y);

                        var itemLayerNum = nameLayerNum;
                        if (t.layer === 27 || t.layer === 28) itemLayerNum = mirrored ? 28 : 27;
                        else if (t.layer === 22 || t.layer === 21) itemLayerNum = mirrored ? 22 : 21;
                        else if (t.layer) itemLayerNum = t.layer;

                        pText.setAttribute("class", `pcb-silk-text layer-${itemLayerNum}`);
                        USED_LAYERS.add(itemLayerNum);

                        var tAngle = getRotationAngle(t.rot);
                        var transformTextStr = "";
                        if (mirrored) transformTextStr += "scale(-1, 1) ";
                        if (tAngle !== 0) transformTextStr += `rotate(${-tAngle}, ${t.x}, ${-t.y}) `;
                        if (transformTextStr !== "") pText.setAttribute("transform", transformTextStr);

                        var val = t.text;
                        if (val === ">NAME" || val === ">Name" || val === ">name") {
                            val = elem.name;
                            hasExplicitName = true;
                        } else if (val === ">VALUE" || val === ">Value" || val === ">value") {
                            val = elem.value;
                        }
                        if (t.size) pText.style.fontSize = `${t.size}px`;

                        pText.textContent = val;
                        gText.appendChild(pText);
                    });

                    if (!hasExplicitName && !elem.smashed) {
                        var defText = document.createElementNS("http://www.w3.org/2000/svg", "text");
                        defText.setAttribute("x", 0);
                        defText.setAttribute("y", 0);
                        defText.setAttribute("text-anchor", "middle");
                        defText.setAttribute("class", `pcb-silk-text layer-${nameLayerNum}`);
                        if (mirrored) defText.setAttribute("transform", "scale(-1, 1)");
                        defText.textContent = elem.name;
                        gText.appendChild(defText);
                        USED_LAYERS.add(nameLayerNum);
                    }
                } else if (!elem.smashed) {
                    var gText = document.createElementNS("http://www.w3.org/2000/svg", "g");
                    gText.setAttribute("class", "interactive-part-text");
                    gText.setAttribute("data-part", elem.name);
                    gText.setAttribute("transform", transformStr);
                    groupText.appendChild(gText);

                    var defText = document.createElementNS("http://www.w3.org/2000/svg", "text");
                    defText.setAttribute("x", 0);
                    defText.setAttribute("y", 0);
                    defText.setAttribute("text-anchor", "middle");
                    defText.setAttribute("class", `pcb-silk-text layer-${nameLayerNum}`);
                    if (mirrored) defText.setAttribute("transform", "scale(-1, 1)");
                    defText.textContent = elem.name;
                    gText.appendChild(defText);
                    USED_LAYERS.add(nameLayerNum);
                }
            });

            // Agujeros directos en la placa (Board Holes Capa 45)
            if (EAGLE_DATA.board.holes) {
                EAGLE_DATA.board.holes.forEach(h => {
                    var holeCircle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
                    holeCircle.setAttribute("cx", h.x);
                    holeCircle.setAttribute("cy", -h.y);
                    holeCircle.setAttribute("r", h.drill / 2);
                    holeCircle.setAttribute("class", "pcb-pad-hole layer-45");
                    groupDrills.appendChild(holeCircle);
                    USED_LAYERS.add(45);
                });
            }
        }

        function buildLayersMenu() {
            var listContainer = document.querySelector(".layer-list");
            if (!listContainer || !EAGLE_DATA.layers) return;
            
            listContainer.innerHTML = "";

            var layerNums = Object.keys(EAGLE_DATA.layers)
                .map(Number)
                .filter(num => USED_LAYERS.has(num))
                .sort((a, b) => a - b);
            
            function getLayerColor(num, name) {
                if (num === 1) return "var(--pcb-top)";
                if (num === 16) return "var(--pcb-bottom)";
                if (num === 17) return "var(--pcb-pad)";
                if (num === 18) return "var(--pcb-via)";
                if (num === 20) return "#475569";
                if (num === 21 || num === 25) return "var(--pcb-silk)";
                if (num === 22 || num === 26) return "#cbd5e1";
                if (num === 44 || num === 45) return "#000000";
                if (num === 47) return "#f59e0b";
                if (num === 51 || num === 52) return "#64748b";
                
                var nameLower = name.toLowerCase();
                if (nameLower.includes("top") || nameLower.startsWith("t")) return "var(--pcb-top)";
                if (nameLower.includes("bottom") || nameLower.startsWith("b")) return "var(--pcb-bottom)";
                return "#475569";
            }

            layerNums.forEach(num => {
                var layer = EAGLE_DATA.layers[num];
                if (!layer) return;

                var label = document.createElement("label");
                label.setAttribute("class", "layer-item");

                var input = document.createElement("input");
                input.setAttribute("type", "checkbox");
                input.setAttribute("id", "chkLayer" + num);
                if (layer.visible) {
                    input.setAttribute("checked", "true");
                }
                input.onchange = function() {
                    toggleLayer(num);
                };

                var spanNum = document.createElement("span");
                spanNum.setAttribute("class", "layer-num");
                spanNum.textContent = num;

                var colorBox = document.createElement("div");
                colorBox.setAttribute("class", "layer-color");
                colorBox.style.backgroundColor = getLayerColor(num, layer.name);
                if (num === 21 || num === 25 || num === 22 || num === 26) {
                    colorBox.style.border = "1px solid var(--border-color)";
                }

                var spanName = document.createElement("span");
                spanName.setAttribute("class", "layer-name");
                spanName.textContent = layer.name;

                label.appendChild(input);
                label.appendChild(spanNum);
                label.appendChild(colorBox);
                label.appendChild(spanName);

                listContainer.appendChild(label);

                toggleLayer(num);
            });
        }

            var checked = chk.checked;
            document.querySelectorAll(".layer-" + layerNum).forEach(el => {
                el.style.display = checked ? "" : "none";
            });

        function triggerRipple(type, x, y) {
            var viewport = document.getElementById(type + 'Viewport');
            if (!viewport) return;
            
            var containerId = type + 'RippleGroup';
            var container = document.getElementById(containerId);
            if (!container) {
                container = document.createElementNS("http://www.w3.org/2000/svg", "g");
                container.setAttribute("id", containerId);
                container.setAttribute("style", "pointer-events: none;");
                viewport.appendChild(container);
            }
            container.innerHTML = "";
            
            var scale = (viewStates[type] && viewStates[type].scale) ? viewStates[type].scale : 5.0;
            var maxRadius = Math.max(14, 115 / scale);
            var minRadius = Math.max(1.0, 4 / scale);
            var dotRadius = Math.max(0.8, 3.8 / scale);
            var tickLen = Math.max(1.6, 9 / scale);
            var tickOffset = Math.max(1.2, 6 / scale);

            var isPcb = (type === 'pcb');
            var primaryColor = isPcb ? '#00f0ff' : '#0284c7';
            var secondaryColor = isPcb ? '#38bdf8' : '#2563eb';
            var dotFill = isPcb ? '#00f0ff' : '#0284c7';
            var dotStroke = '#ffffff';

            var beacon = document.createElementNS("http://www.w3.org/2000/svg", "g");
            beacon.setAttribute("transform", `translate(${x}, ${y})`);
            beacon.setAttribute("class", "sonar-beacon");
            
            // Subgrupo de retícula central con desvanecimiento (fade-out)
            var centerGroup = document.createElementNS("http://www.w3.org/2000/svg", "g");
            centerGroup.setAttribute("class", "sonar-center-group");

            // Retícula / Crosshair sutil tipo mira radar
            var ticks = [
                { x1: 0, y1: -tickOffset - tickLen, x2: 0, y2: -tickOffset },
                { x1: 0, y1: tickOffset, x2: 0, y2: tickOffset + tickLen },
                { x1: -tickOffset - tickLen, y1: 0, x2: -tickOffset, y2: 0 },
                { x1: tickOffset, y1: 0, x2: tickOffset + tickLen, y2: 0 }
            ];
            ticks.forEach(function(t) {
                var l = document.createElementNS("http://www.w3.org/2000/svg", "line");
                l.setAttribute("x1", t.x1);
                l.setAttribute("y1", t.y1);
                l.setAttribute("x2", t.x2);
                l.setAttribute("y2", t.y2);
                l.setAttribute("stroke", primaryColor);
                l.setAttribute("stroke-width", "2");
                l.setAttribute("vector-effect", "non-scaling-stroke");
                centerGroup.appendChild(l);
            });

            // Punto central brillante pulsante
            var dot = document.createElementNS("http://www.w3.org/2000/svg", "circle");
            dot.setAttribute("cx", 0);
            dot.setAttribute("cy", 0);
            dot.setAttribute("r", dotRadius);
            dot.setAttribute("fill", dotFill);
            dot.setAttribute("stroke", dotStroke);
            dot.setAttribute("stroke-width", "1.5");
            dot.setAttribute("vector-effect", "non-scaling-stroke");
            centerGroup.appendChild(dot);
            beacon.appendChild(centerGroup);

            // Animar centro: pulso suave y fade-out hacia los 2.1s
            centerGroup.animate([
                { opacity: 1 },
                { opacity: 1, offset: 0.5 },
                { opacity: 0, offset: 1.0 }
            ], {
                duration: 2100,
                easing: 'ease-out',
                fill: 'forwards'
            });

            dot.animate([
                { r: String(dotRadius * 0.8), opacity: 1 },
                { r: String(dotRadius * 1.5), opacity: 1 },
                { r: String(dotRadius * 0.8), opacity: 1 }
            ], {
                duration: 700,
                iterations: 3,
                easing: 'ease-in-out'
            });

            // 4 ondas concéntricas finitas (el centro deja de emitir ondas antes de desaparecer)
            var numRings = 4;
            var waveDuration = 1500;
            var waveStep = 280;
            var ringColors = isPcb 
                ? [primaryColor, secondaryColor, primaryColor, secondaryColor] 
                : [primaryColor, secondaryColor, '#0369a1', secondaryColor];

            for (var i = 0; i < numRings; i++) {
                var ring = document.createElementNS("http://www.w3.org/2000/svg", "circle");
                ring.setAttribute("cx", 0);
                ring.setAttribute("cy", 0);
                ring.setAttribute("r", minRadius);
                ring.setAttribute("fill", "none");
                ring.setAttribute("stroke", ringColors[i % ringColors.length]);
                ring.setAttribute("stroke-width", "3");
                ring.setAttribute("vector-effect", "non-scaling-stroke");
                ring.setAttribute("opacity", "0");
                beacon.appendChild(ring);

                ring.animate([
                    { r: String(minRadius), opacity: 0, strokeWidth: '3.5px' },
                    { r: String(minRadius + (maxRadius - minRadius) * 0.1), opacity: 1, strokeWidth: '3.0px', offset: 0.08 },
                    { r: String(minRadius + (maxRadius - minRadius) * 0.4), opacity: 0.85, strokeWidth: '2.2px', offset: 0.35 },
                    { r: String(minRadius + (maxRadius - minRadius) * 0.75), opacity: 0.4, strokeWidth: '1.2px', offset: 0.7 },
                    { r: String(maxRadius), opacity: 0, strokeWidth: '0.5px', offset: 1.0 }
                ], {
                    duration: waveDuration,
                    delay: i * waveStep,
                    easing: 'cubic-bezier(0.1, 0.4, 0.2, 1)',
                    fill: 'forwards'
                });
            }

            container.appendChild(beacon);
            
            clearTimeout(rippleTimers[type]);
            rippleTimers[type] = setTimeout(function() {
                if (container) container.innerHTML = "";
            }, 2600);
        }

        function centerOnPoint(type, targetX, targetY) {
            var svg = document.getElementById(type + 'Svg');
            if (!svg) return;
            var rect = svg.getBoundingClientRect();
            var centerX = rect.width / 2;
            var centerY = rect.height / 2;
            var state = viewStates[type];
            var scaleX = (type === 'pcb' && state.flipped) ? -state.scale : state.scale;
            
            state.x = centerX - targetX * scaleX;
            state.y = centerY - targetY * state.scale;
            
            if (type === 'pcb') {
                updatePcbTransform();
            } else {
                var viewport = document.getElementById('schViewport');
                if (viewport) {
                    viewport.setAttribute("transform", `translate(${state.x}, ${state.y}) scale(${scaleX}, ${state.scale})`);
                }
            }
        }

        function highlightPart(partName, value, source) {
            // Limpiar ondas previas en ambos paneles para evitar residuos visuales
            var oldSchRipple = document.getElementById("schRippleGroup");
            if (oldSchRipple) oldSchRipple.innerHTML = "";
            var oldPcbRipple = document.getElementById("pcbRippleGroup");
            if (oldPcbRipple) oldPcbRipple.innerHTML = "";

            // Si la parte pertenece a otra hoja en el esquemático, cambiar automáticamente a esa hoja
            if (EAGLE_DATA.schematic && EAGLE_DATA.schematic.instances) {
                var foundInst = EAGLE_DATA.schematic.instances.find(i => i.part === partName);
                if (foundInst && foundInst.sheet && foundInst.sheet !== (currentSheetIndex + 1)) {
                    currentSheetIndex = foundInst.sheet - 1;
                    buildSheetMenu();
                    renderSchematic();
                }
            }

            document.querySelectorAll(".highlighted").forEach(el => el.classList.remove("highlighted"));
            document.querySelectorAll(".highlighted-bg").forEach(el => el.classList.remove("highlighted-bg"));

            var elements = document.querySelectorAll(`[data-part="${partName}"]`);
            elements.forEach(el => {
                el.classList.add("highlighted");
                var rect = el.querySelector(".sch-part-rect, .pcb-pad-smd-top, .pcb-pad-smd-bottom, .pcb-pad-thru");
                if (rect) {
                    rect.classList.add("highlighted-bg");
                }
            });

            // Localización visual cruzada con onditas animadas en el lado opuesto
            if (source === 'sch' || !source) {
                if (EAGLE_DATA.board && EAGLE_DATA.board.elements) {
                    var pcbElem = EAGLE_DATA.board.elements.find(e => e.name === partName);
                    if (pcbElem) {
                        var px = pcbElem.x;
                        var py = -pcbElem.y;
                        triggerRipple('pcb', px, py);
                        if (autoCenterEnabled) {
                            centerOnPoint('pcb', px, py);
                        }
                    }
                }
            }
            if (source === 'pcb' || !source) {
                var schInst = null;
                if (EAGLE_DATA.schematic) {
                    var sheet = getActiveSheet();
                    if (sheet && sheet.instances) {
                        schInst = sheet.instances.find(i => i.part === partName);
                    }
                    if (!schInst && EAGLE_DATA.schematic.instances) {
                        schInst = EAGLE_DATA.schematic.instances.find(i => i.part === partName);
                    }
                }
                if (schInst) {
                    var sx = schInst.x;
                    var sy = -schInst.y;
                    triggerRipple('sch', sx, sy);
                    if (autoCenterEnabled) {
                        centerOnPoint('sch', sx, sy);
                    }
                }
            }

            var infoPanel = document.getElementById("schInfoPanel");
            var partTitle = document.getElementById("infoPartName");
            var partDetails = document.getElementById("infoPartDetails");

            partTitle.innerText = partName;
            partDetails.innerText = "Valor: " + (value || "N/A");
            infoPanel.style.display = "block";
        }



        function getPcbBounds() {
            var minX = 99999, maxX = -99999, minY = 99999, maxY = -99999;
            if (EAGLE_DATA.board && EAGLE_DATA.board.dimension && EAGLE_DATA.board.dimension.length > 0) {
                EAGLE_DATA.board.dimension.forEach(function(d) {
                    minX = Math.min(minX, d.x1, d.x2);
                    maxX = Math.max(maxX, d.x1, d.x2);
                    minY = Math.min(minY, -d.y1, -d.y2);
                    maxY = Math.max(maxY, -d.y1, -d.y2);
                });
            } else if (EAGLE_DATA.board && EAGLE_DATA.board.elements && EAGLE_DATA.board.elements.length > 0) {
                EAGLE_DATA.board.elements.forEach(function(e) {
                    minX = Math.min(minX, e.x);
                    maxX = Math.max(maxX, e.x);
                    minY = Math.min(minY, -e.y);
                    maxY = Math.max(maxY, -e.y);
                });
            } else {
                return { minX: 0, maxX: 100, minY: -100, maxY: 0, width: 100, height: 100, cx: 50, cy: -50 };
            }
            return {
                minX: minX, maxX: maxX, minY: minY, maxY: maxY,
                width: Math.max(1, maxX - minX), height: Math.max(1, maxY - minY),
                cx: (minX + maxX) / 2, cy: (minY + maxY) / 2
            };
        }

        function getSchBounds() {
            var minX = 99999, maxX = -99999, minY = 99999, maxY = -99999;
            var sheet = getActiveSheet();
            var instances = (sheet && sheet.instances) ? sheet.instances : ((EAGLE_DATA.schematic && EAGLE_DATA.schematic.instances) ? EAGLE_DATA.schematic.instances : []);
            var nets = (sheet && sheet.nets) ? sheet.nets : ((EAGLE_DATA.schematic && EAGLE_DATA.schematic.nets) ? EAGLE_DATA.schematic.nets : []);

            instances.forEach(function(inst) {
                minX = Math.min(minX, inst.x);
                maxX = Math.max(maxX, inst.x);
                minY = Math.min(minY, -inst.y);
                maxY = Math.max(maxY, -inst.y);
            });

            nets.forEach(function(net) {
                (net.wires || []).forEach(function(w) {
                    minX = Math.min(minX, w.x1, w.x2);
                    maxX = Math.max(maxX, w.x1, w.x2);
                    minY = Math.min(minY, -w.y1, -w.y2);
                    maxY = Math.max(maxY, -w.y1, -w.y2);
                });
            });

            if (minX > maxX) {
                return { minX: 0, maxX: 200, minY: -150, maxY: 0, width: 200, height: 150, cx: 100, cy: -75 };
            }

            return {
                minX: minX, maxX: maxX, minY: minY, maxY: maxY,
                width: Math.max(1, maxX - minX), height: Math.max(1, maxY - minY),
                cx: (minX + maxX) / 2, cy: (minY + maxY) / 2
            };
        }

        function zoomBy(type, factor) {
            var svg = document.getElementById(type + 'Svg');
            if (!svg) return;
            var rect = svg.getBoundingClientRect();
            var centerX = rect.width / 2;
            var centerY = rect.height / 2;

            var state = viewStates[type];
            var oldScale = state.scale;
            var newScale = Math.max(0.05, Math.min(state.scale * factor, 80));

            state.scale = newScale;
            state.x = centerX - (centerX - state.x) * (newScale / oldScale);
            state.y = centerY - (centerY - state.y) * (newScale / oldScale);

            var viewport = document.getElementById(type + 'Viewport');
            var scaleX = (type === 'pcb' && state.flipped) ? -state.scale : state.scale;
            viewport.setAttribute("transform", "translate(" + state.x + ", " + state.y + ") scale(" + scaleX + ", " + state.scale + ")");
        }

        function updatePcbTransform() {
            var state = viewStates.pcb;
            var viewport = document.getElementById('pcbViewport');
            if (!viewport) return;
            var scaleX = state.flipped ? -state.scale : state.scale;
            viewport.setAttribute("transform", "translate(" + state.x + ", " + state.y + ") scale(" + scaleX + ", " + state.scale + ")");
            var btnFlip = document.getElementById("btnPcbFlip");
            if (btnFlip) {
                if (state.flipped) btnFlip.classList.add("active");
                else btnFlip.classList.remove("active");
            }
        }

        function togglePcbFlip() {
            viewStates.pcb.flipped = !viewStates.pcb.flipped;
            updatePcbTransform();
        }

        function setPcbPreset(preset) {
            document.querySelectorAll("#btnPresetTop, #btnPresetBottom, #btnPresetBoth").forEach(function(b) {
                b.classList.remove("active");
            });

            var topLayers = new Set([1, 17, 18, 20, 21, 23, 25, 27, 45, 51]);
            var bottomLayers = new Set([16, 17, 18, 20, 22, 24, 26, 28, 45, 52]);

            if (preset === 'top') {
                var b = document.getElementById("btnPresetTop");
                if (b) b.classList.add("active");
                viewStates.pcb.flipped = false;
                USED_LAYERS.forEach(function(num) {
                    setLayerState(num, topLayers.has(num));
                });
            } else if (preset === 'bottom') {
                var b = document.getElementById("btnPresetBottom");
                if (b) b.classList.add("active");
                viewStates.pcb.flipped = false; // Modo CAD idéntico a EAGLE (para voltear físico, usar botón Voltear)
                USED_LAYERS.forEach(function(num) {
                    setLayerState(num, bottomLayers.has(num));
                });
            } else if (preset === 'both') {
                var b = document.getElementById("btnPresetBoth");
                if (b) b.classList.add("active");
                viewStates.pcb.flipped = false;
                USED_LAYERS.forEach(function(num) {
                    setLayerState(num, true);
                });
            }
            updatePcbTransform();
        }

        function setLayerState(num, visible) {
            var chk = document.getElementById("chkLayer" + num);
            if (chk) chk.checked = visible;
            document.querySelectorAll(".layer-" + num).forEach(function(el) {
                el.style.display = visible ? "" : "none";
            });
        }

        function setupInteraction(svgId, viewportId, type) {
            var svg = document.getElementById(svgId);
            var viewport = document.getElementById(viewportId);
            var state = viewStates[type];

            function updateTransform() {
                var scaleX = (type === "pcb" && state.flipped) ? -state.scale : state.scale;
                viewport.setAttribute("transform", "translate(" + state.x + ", " + state.y + ") scale(" + scaleX + ", " + state.scale + ")");
            }

            // Pan vía MouseDown
            svg.addEventListener('mousedown', function(e) {
                state.dragging = true;
                state.startX = e.clientX - state.x;
                state.startY = e.clientY - state.y;
                state.clickOriginX = e.clientX;
                state.clickOriginY = e.clientY;
                document.body.style.userSelect = "none";
                svg.style.cursor = "grabbing";
            });

            // Smooth Window Pan Listeners (no se congela al salir del SVG)
            window.addEventListener('mousemove', function(e) {
                if (!state.dragging) return;
                state.x = e.clientX - state.startX;
                state.y = e.clientY - state.startY;
                updateTransform();
            });

            window.addEventListener('mouseup', function(e) {
                if (!state.dragging) return;
                state.dragging = false;
                document.body.style.userSelect = "";
                svg.style.cursor = "grab";

                var dx = e.clientX - state.clickOriginX;
                var dy = e.clientY - state.clickOriginY;
                state.wasDrag = Math.sqrt(dx * dx + dy * dy) > 4;
            });

            // Touch support para laptops táctiles y touchpads
            svg.addEventListener('touchstart', function(e) {
                if (e.touches.length === 1) {
                    state.dragging = true;
                    state.startX = e.touches[0].clientX - state.x;
                    state.startY = e.touches[0].clientY - state.y;
                }
            }, { passive: true });

            window.addEventListener('touchmove', function(e) {
                if (state.dragging && e.touches.length === 1) {
                    state.x = e.touches[0].clientX - state.startX;
                    state.y = e.touches[0].clientY - state.startY;
                    updateTransform();
                }
            }, { passive: true });

            window.addEventListener('touchend', function() {
                state.dragging = false;
            });

            // Selección y Deselección delegada en SVG
            svg.addEventListener('click', function(e) {
                if (state.wasDrag) {
                    state.wasDrag = false;
                    return;
                }
                var hitPart = e.target.closest('.interactive-part, .interactive-part-text, .pcb-element');
                if (hitPart) {
                    var partName = hitPart.getAttribute('data-part');
                    if (partName) {
                        var pVal = "";
                        if (type === "pcb" && EAGLE_DATA.board && EAGLE_DATA.board.elements) {
                            var pe = EAGLE_DATA.board.elements.find(e => e.name === partName);
                            if (pe) pVal = pe.value;
                        } else if (type === "sch" && EAGLE_DATA.schematic) {
                            var inst = null;
                            var sheet = getActiveSheet();
                            if (sheet && sheet.instances) inst = sheet.instances.find(i => i.part === partName);
                            if (!inst && EAGLE_DATA.schematic.instances) inst = EAGLE_DATA.schematic.instances.find(i => i.part === partName);
                            if (inst) pVal = inst.value;
                        }
                        highlightPart(partName, pVal, type);
                    }
                } else {
                    clearSelection();
                }
            });

            // Zoom suave con Rueda y Trackpad
            svg.addEventListener('wheel', function(e) {
                e.preventDefault();
                var zoomFactor = e.deltaY < 0 ? 1.15 : 0.87;

                var rect = svg.getBoundingClientRect();
                var mouseX = e.clientX - rect.left;
                var mouseY = e.clientY - rect.top;

                var oldScale = state.scale;
                var newScale = Math.max(0.05, Math.min(state.scale * zoomFactor, 80));

                state.scale = newScale;
                state.x = mouseX - (mouseX - state.x) * (newScale / oldScale);
                state.y = mouseY - (mouseY - state.y) * (newScale / oldScale);

                updateTransform();
            }, { passive: false });

            updateTransform();
        }

        function clearSelection() {
            document.querySelectorAll(".highlighted").forEach(el => el.classList.remove("highlighted"));
            document.querySelectorAll(".highlighted-bg").forEach(el => el.classList.remove("highlighted-bg"));
            var schR = document.getElementById("schRippleGroup");
            if (schR) schR.innerHTML = "";
            var pcbR = document.getElementById("pcbRippleGroup");
            if (pcbR) pcbR.innerHTML = "";
            var infoPanel = document.getElementById("schInfoPanel");
            if (infoPanel) infoPanel.style.display = "none";
        }


        function resetZoom(type) {
            var svg = document.getElementById(type + 'Svg');
            if (!svg) return;
            var rect = svg.getBoundingClientRect();
            if (rect.width === 0 || rect.height === 0) return;

            var bounds = (type === 'pcb') ? getPcbBounds() : getSchBounds();
            var availW = rect.width * 0.85;
            var availH = rect.height * 0.85;

            var scale = Math.min(availW / bounds.width, availH / bounds.height);
            scale = Math.max(0.1, Math.min(scale, 60));

            var state = viewStates[type];
            state.scale = scale;
            state.x = (rect.width / 2) - bounds.cx * scale;
            state.y = (rect.height / 2) - bounds.cy * scale;

            var viewport = document.getElementById(type + 'Viewport');
            var scaleX = (type === "pcb" && state.flipped) ? -state.scale : state.scale;
            viewport.setAttribute("transform", "translate(" + state.x + ", " + state.y + ") scale(" + scaleX + ", " + state.scale + ")");
        }

        function getRotationAngle(rotStr) {
            if (!rotStr) return 0;
            var match = rotStr.match(/R(\d+)/);
            return match ? parseInt(match[1]) : 0;
        }

        function isMirrored(rotStr) {
            return rotStr && rotStr.includes('M');
        }

        function getPinLength(lenStr) {
            switch(lenStr) {
                case 'long': return 7.62;
                case 'middle': return 5.08;
                case 'short': return 2.54;
                case 'point': return 0.0;
                default: return 5.08;
            }
        }

        function lookupSymbol(deviceset) {
            for (var key in EAGLE_DATA.schematic.symbols) {
                if (key.endsWith('_' + deviceset)) {
                    return EAGLE_DATA.schematic.symbols[key];
                }
            }
            return null;
        }
    </script>
