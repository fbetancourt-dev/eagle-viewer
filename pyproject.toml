[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "eagle-viewer"
version = "1.0.0"
description = "EAGLE CAD Standalone Interactive Web & Vector Viewer CLI"
readme = "README.md"
authors = [
    { name = "Francisco Betancourt" }
]
license = { text = "MIT" }
requires-python = ">=3.8"
keywords = ["eagle", "cad", "pcb", "schematic", "viewer", "hardware", "svg"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]

[project.scripts]
eagle-viewer = "main:main"

[tool.setuptools]
py-modules = ["main", "eagle_parser", "eagle_to_svg"]

[tool.setuptools.package-data]
"*" = ["templates/*"]
